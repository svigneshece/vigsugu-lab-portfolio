<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Grid -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="225" r="140" fill="url(#nodeGlow)" />
  <circle cx="600" cy="225" r="140" fill="url(#nodeGlow)" />

  <!-- Top Tech Bar -->
  <rect x="30" y="24" width="740" height="36" rx="6" fill="#0c111d" stroke="#1f293d" stroke-width="1" />
  <circle cx="50" cy="42" r="4" fill="#00f0ff" />
  <text x="65" y="46" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1.5">DECENTRALIZED LORA SX1278 · 433 MHz MESH TOPOLOGY</text>
  <rect x="670" y="32" width="85" height="20" rx="4" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
  <text x="682" y="46" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">AES-128</text>

  <!-- Mesh Connections (Lines) -->
  <line x1="200" y1="225" x2="400" y2="150" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.8" filter="url(#neonBlur)" />
  <line x1="400" y1="150" x2="600" y2="225" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.8" filter="url(#neonBlur)" />
  <line x1="200" y1="225" x2="400" y2="300" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5" />
  <line x1="400" y1="300" x2="600" y2="225" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5" />
  <line x1="200" y1="225" x2="600" y2="225" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,6" stroke-opacity="0.25" />

  <!-- Signal Pulse Rings on Gateway Node -->
  <circle cx="200" cy="225" r="45" fill="none" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="200" cy="225" r="70" fill="none" stroke="#00f0ff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,8" />

  <!-- Node 1: Gateway Node (Left) -->
  <g transform="translate(140, 175)">
    <rect width="120" height="100" rx="10" fill="#0d1424" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="8" y="8" width="104" height="22" rx="4" fill="#00f0ff" fill-opacity="0.1" />
    <text x="16" y="23" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">NODE A [COORD]</text>
    <text x="14" y="48" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">Solar + LiPo</text>
    <text x="14" y="66" fill="#38bdf8" font-family="monospace" font-size="10">RSSI: -74 dBm</text>
    <text x="14" y="84" fill="#64748b" font-family="monospace" font-size="9">Volt: 4.18V OK</text>
  </g>

  <!-- Node 2: Relay Node (Center-Top) -->
  <g transform="translate(340, 95)">
    <rect width="120" height="90" rx="10" fill="#0d1424" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="8" y="8" width="104" height="20" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="16" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RELAY NODE 01</text>
    <text x="14" y="46" fill="#e2e8f0" font-family="monospace" font-size="10">Hop: 1 · RSSI -82</text>
    <text x="14" y="64" fill="#00f0ff" font-family="monospace" font-size="10">Range: ~200m</text>
    <text x="14" y="78" fill="#64748b" font-family="monospace" font-size="9">ESP32 + SX1278</text>
  </g>

  <!-- Node 3: Sensor Node (Center-Bottom) -->
  <g transform="translate(340, 255)">
    <rect width="120" height="90" rx="10" fill="#0d1424" stroke="#6366f1" stroke-width="1.2" />
    <rect x="8" y="8" width="104" height="20" rx="4" fill="#6366f1" fill-opacity="0.1" />
    <text x="16" y="22" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">SENSOR NODE 02</text>
    <text x="14" y="46" fill="#e2e8f0" font-family="monospace" font-size="10">NEO-6M GPS</text>
    <text x="14" y="64" fill="#94a3b8" font-family="monospace" font-size="9">Lat 12.97° Long 80.24°</text>
    <text x="14" y="78" fill="#34d399" font-family="monospace" font-size="9">Status: TX Ready</text>
  </g>

  <!-- Node 4: Base Station / Sink (Right) -->
  <g transform="translate(540, 175)">
    <rect width="120" height="100" rx="10" fill="#0d1424" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="8" y="8" width="104" height="22" rx="4" fill="#3b82f6" fill-opacity="0.1" />
    <text x="16" y="23" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold">SINK / RX NODE</text>
    <text x="14" y="48" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">Packet Collector</text>
    <text x="14" y="66" fill="#34d399" font-family="monospace" font-size="10">Delivery: 96.4%</text>
    <text x="14" y="84" fill="#64748b" font-family="monospace" font-size="9">500 Tx Tested</text>
  </g>

  <!-- Live Waveform & Packet HUD (Bottom) -->
  <rect x="30" y="380" width="740" height="46" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(50, 408)">
    <text x="0" y="0" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">METRICS:</text>
    <text x="80" y="0" fill="#f8fafc" font-family="monospace" font-size="11">DELIVERY RATE: <tspan fill="#34d399">≈96%</tspan></text>
    <text x="260" y="0" fill="#f8fafc" font-family="monospace" font-size="11">TX COUNT: <tspan fill="#38bdf8">500 PACKETS</tspan></text>
    <text x="440" y="0" fill="#f8fafc" font-family="monospace" font-size="11">BW: <tspan fill="#94a3b8">125 kHz</tspan></text>
    <text x="560" y="0" fill="#f8fafc" font-family="monospace" font-size="11">ROUTING: <tspan fill="#00f0ff">RSSI OPTIMIZED</tspan></text>
  </g>
</svg>

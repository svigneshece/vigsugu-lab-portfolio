<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="picBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>
    <radialGradient id="lcdBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="clcdDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38bdf8" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#picBg)" />
  <rect width="800" height="450" fill="url(#clcdDots)" />

  <!-- Top Tech Bar -->
  <rect x="30" y="24" width="740" height="38" rx="6" fill="#0b1322" stroke="#1d2e48" stroke-width="1" />
  <circle cx="52" cy="43" r="4" fill="#38bdf8" />
  <text x="68" y="47" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1.5">PIC16F877A · EMBEDDED C APPLIANCE AUTOMATION &amp; SIMULATION</text>
  <rect x="640" y="32" width="115" height="22" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
  <text x="652" y="47" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">MPLAB X IDE</text>

  <!-- Left: PIC16F877A Registers & Peripherals -->
  <g transform="translate(45, 80)">
    <rect width="215" height="280" rx="10" fill="#080e18" stroke="#1c2d42" stroke-width="1.2" />
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#38bdf8" fill-opacity="0.08" />
    <text x="22" y="29" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">PIC16F877A REGISTERS</text>

    <!-- Register block 1: Timer 2 PWM -->
    <g transform="translate(16, 52)">
      <rect width="183" height="40" rx="4" fill="#0f1929" stroke="#233854" stroke-width="1" />
      <text x="12" y="19" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">T2CON / PR2: <tspan fill="#f8fafc">PWM TIMER</tspan></text>
      <text x="12" y="33" fill="#94a3b8" font-family="monospace" font-size="9">Prescaler 1:16 · Period 20ms</text>
    </g>

    <!-- Register block 2: CCP1CON -->
    <g transform="translate(16, 100)">
      <rect width="183" height="40" rx="4" fill="#0f1929" stroke="#233854" stroke-width="1" />
      <text x="12" y="19" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">CCP1CON: <tspan fill="#f8fafc">HEATER DUTY</tspan></text>
      <text x="12" y="33" fill="#94a3b8" font-family="monospace" font-size="9">PWM Mode · 80% Output Duty</text>
    </g>

    <!-- Register block 3: INTCON / EEPROM -->
    <g transform="translate(16, 148)">
      <rect width="183" height="40" rx="4" fill="#0f1929" stroke="#233854" stroke-width="1" />
      <text x="12" y="19" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">INTCON: <tspan fill="#f8fafc">TMR0 INTERRUPT</tspan></text>
      <text x="12" y="33" fill="#94a3b8" font-family="monospace" font-size="9">1-Second Countdown ISR Tick</text>
    </g>

    <!-- Safety Interlock Flag -->
    <rect x="16" y="198" width="183" height="68" rx="6" fill="#060c14" stroke="#1c2d42" stroke-width="1" />
    <text x="24" y="218" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SAFETY INTERLOCK: RB0</text>
    <text x="24" y="234" fill="#34d399" font-family="monospace" font-size="10">DOOR SWITCH: CLOSED [OK]</text>
    <text x="24" y="252" fill="#94a3b8" font-family="monospace" font-size="9">Proteus Simulated Circuit</text>
  </g>

  <!-- Center: 16x2 Character LCD Screen Simulation -->
  <g transform="translate(280, 80)">
    <circle cx="120" cy="140" r="120" fill="url(#lcdBacklight)" />
    <!-- Outer Appliance Bezel -->
    <rect width="240" height="280" rx="12" fill="#050810" stroke="#38bdf8" stroke-width="1.6" />
    
    <rect x="10" y="10" width="220" height="24" rx="4" fill="#0c1626" />
    <text x="18" y="26" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">16x2 CLCD · APPLIANCE PANEL</text>

    <!-- Liquid Crystal Display Face -->
    <g transform="translate(15, 45)">
      <!-- LCD Screen Border -->
      <rect width="210" height="110" rx="6" fill="#042028" stroke="#0e7490" stroke-width="2" />
      
      <!-- Line 1 of 16x2 LCD -->
      <rect x="10" y="16" width="190" height="32" rx="3" fill="#083344" />
      <text x="16" y="38" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">MODE: MICRO 80%</text>

      <!-- Line 2 of 16x2 LCD -->
      <rect x="10" y="56" width="190" height="32" rx="3" fill="#083344" />
      <text x="16" y="78" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">TIME: 02:45 RUN</text>
    </g>

    <!-- 4x3 Keypad Matrix Simulation -->
    <g transform="translate(25, 175)">
      <rect width="190" height="85" rx="6" fill="#08101d" stroke="#1d2e48" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold">KEYPAD MATRIX (PORTD)</text>
      
      <!-- Keypad buttons grid -->
      <g transform="translate(14, 30)">
        <rect x="0" y="0" width="22" height="18" rx="2" fill="#16253b" /><text x="8" y="13" fill="#e2e8f0" font-family="monospace" font-size="9">1</text>
        <rect x="28" y="0" width="22" height="18" rx="2" fill="#16253b" /><text x="36" y="13" fill="#e2e8f0" font-family="monospace" font-size="9">2</text>
        <rect x="56" y="0" width="22" height="18" rx="2" fill="#16253b" /><text x="64" y="13" fill="#e2e8f0" font-family="monospace" font-size="9">3</text>
        <rect x="84" y="0" width="34" height="18" rx="2" fill="#0284c7" /><text x="90" y="13" fill="#ffffff" font-family="monospace" font-size="8">START</text>

        <rect x="0" y="24" width="22" height="18" rx="2" fill="#16253b" /><text x="8" y="37" fill="#e2e8f0" font-family="monospace" font-size="9">4</text>
        <rect x="28" y="24" width="22" height="18" rx="2" fill="#16253b" /><text x="36" y="37" fill="#e2e8f0" font-family="monospace" font-size="9">5</text>
        <rect x="56" y="24" width="22" height="18" rx="2" fill="#16253b" /><text x="64" y="37" fill="#e2e8f0" font-family="monospace" font-size="9">6</text>
        <rect x="84" y="24" width="34" height="18" rx="2" fill="#dc2626" /><text x="92" y="37" fill="#ffffff" font-family="monospace" font-size="8">STOP</text>
      </g>
    </g>
  </g>

  <!-- Right: PWM Cooking Waveform & State Machine -->
  <g transform="translate(540, 80)">
    <rect width="215" height="280" rx="10" fill="#080e18" stroke="#1c2d42" stroke-width="1.2" />
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="22" y="29" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">HEATER PWM WAVEFORM</text>

    <!-- Waveform Box -->
    <g transform="translate(16, 50)">
      <rect width="183" height="75" rx="4" fill="#0d1828" stroke="#1d2e48" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-family="monospace" font-size="9">80% DUTY CYCLE (RC2/CCP1)</text>
      <!-- Square Wave -->
      <path d="M 12 55 L 42 55 L 42 30 L 72 30 L 72 55 L 82 55 L 82 30 L 112 30 L 112 55 L 122 55 L 122 30 L 152 30 L 152 55 L 170 55" fill="none" stroke="#22d3ee" stroke-width="2" />
      <text x="12" y="70" fill="#94a3b8" font-family="monospace" font-size="8">T_ON: 16ms | T_OFF: 4ms</text>
    </g>

    <!-- State Machine Status -->
    <g transform="translate(16, 138)">
      <rect width="183" height="126" rx="6" fill="#060c14" stroke="#1c2d42" stroke-width="1" />
      <text x="14" y="22" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">FINITE STATE MACHINE</text>
      
      <text x="14" y="44" fill="#38bdf8" font-family="monospace" font-size="9">▶ 1. MICRO MODE: ACTIVE</text>
      <text x="14" y="62" fill="#64748b" font-family="monospace" font-size="9">  2. GRILL MODE: READY</text>
      <text x="14" y="80" fill="#64748b" font-family="monospace" font-size="9">  3. CONVECTION: READY</text>
      <text x="14" y="98" fill="#64748b" font-family="monospace" font-size="9">  4. START / RESUME HANDLER</text>
      <text x="14" y="116" fill="#34d399" font-family="monospace" font-size="9">BUZZER BEEP: 5s ON COMPLETION</text>
    </g>
  </g>

  <!-- Bottom Banner Bar -->
  <rect x="30" y="380" width="740" height="46" rx="8" fill="#080e18" stroke="#1d2e48" stroke-width="1" />
  <g transform="translate(50, 408)">
    <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">TARGET:</text>
    <text x="65" y="0" fill="#f8fafc" font-family="monospace" font-size="11">PIC16F877A @ 20MHz OSC</text>
    <text x="280" y="0" fill="#f8fafc" font-family="monospace" font-size="11">PERIPHERALS: <tspan fill="#38bdf8">TMR0 · CCP1 · CLCD 16x2</tspan></text>
    <text x="560" y="0" fill="#f8fafc" font-family="monospace" font-size="11">SIM: <tspan fill="#34d399">PROTEUS &amp; PICSIMLAB</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <radialGradient id="rvizCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="rvizGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#rosBg)" />
  <rect width="800" height="450" fill="url(#rvizGrid)" />

  <!-- Top Tech Bar -->
  <rect x="30" y="24" width="740" height="38" rx="6" fill="#0b1324" stroke="#1d2e4d" stroke-width="1" />
  <circle cx="52" cy="43" r="4" fill="#38bdf8" />
  <text x="68" y="47" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1.5">ROS 2 HUMBLE · RVIZ 3D POINT CLOUD &amp; URDF SIMULATION</text>
  <rect x="635" y="32" width="120" height="22" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
  <text x="645" y="47" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CYCLONEDDS</text>

  <!-- Left: Node Graph & RCLPY Architecture -->
  <g transform="translate(45, 80)">
    <rect width="215" height="280" rx="10" fill="#080e1a" stroke="#1c2b42" stroke-width="1.2" />
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#38bdf8" fill-opacity="0.08" />
    <text x="22" y="29" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">ROS 2 COMPUTATION GRAPH</text>

    <!-- Node 1 -->
    <g transform="translate(16, 52)">
      <rect width="183" height="42" rx="5" fill="#0f1a2e" stroke="#2a3f63" stroke-width="1" />
      <text x="12" y="20" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold">NODE: /teleop_keyboard</text>
      <text x="12" y="34" fill="#64748b" font-family="monospace" font-size="9">Publishes: GeometryMsgs/Twist</text>
    </g>

    <!-- Arrow down -->
    <line x1="107" y1="94" x2="107" y2="114" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="114" y="108" fill="#22d3ee" font-family="monospace" font-size="8">/cmd_vel</text>

    <!-- Node 2 -->
    <g transform="translate(16, 114)">
      <rect width="183" height="46" rx="5" fill="#0f1a2e" stroke="#22d3ee" stroke-width="1.2" />
      <text x="12" y="20" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="bold">NODE: /diff_drive_base</text>
      <text x="12" y="34" fill="#e2e8f0" font-family="monospace" font-size="9">v: 0.45 m/s · ω: 0.12 rad/s</text>
    </g>

    <!-- Arrow down -->
    <line x1="107" y1="160" x2="107" y2="180" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="114" y="174" fill="#a78bfa" font-family="monospace" font-size="8">/odom</text>

    <!-- Node 3 -->
    <g transform="translate(16, 180)">
      <rect width="183" height="44" rx="5" fill="#0f1a2e" stroke="#2a3f63" stroke-width="1" />
      <text x="12" y="20" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">NODE: /rviz2_visualizer</text>
      <text x="12" y="34" fill="#64748b" font-family="monospace" font-size="9">URDF + TF2 Broadcaster</text>
    </g>

    <rect x="16" y="234" width="183" height="32" rx="4" fill="#050a14" />
    <text x="24" y="254" fill="#34d399" font-family="monospace" font-size="10">ROS_DOMAIN_ID: 0 [ACTIVE]</text>
  </g>

  <!-- Center: RViz 3D Perspective Viewport -->
  <g transform="translate(280, 80)">
    <circle cx="120" cy="140" r="120" fill="url(#rvizCenterGlow)" />
    <rect width="240" height="280" rx="10" fill="#030712" stroke="#22d3ee" stroke-width="1.5" />
    
    <!-- Viewport Header -->
    <rect x="10" y="10" width="220" height="24" rx="4" fill="#0c182a" />
    <text x="20" y="26" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RVIZ2: /scan + base_link TF</text>

    <!-- 3D Perspective Isometric Grid -->
    <g transform="translate(120, 150)">
      <!-- Isometric ground grid lines -->
      <line x1="-90" y1="20" x2="90" y2="20" stroke="#1e293b" stroke-width="1" />
      <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#1e293b" stroke-width="1" />
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#334155" stroke-width="1.2" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#334155" stroke-width="1.2" />

      <!-- Robot Chassis (URDF box + wheels) -->
      <rect x="-35" y="-20" width="70" height="40" rx="6" fill="#0e243d" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Left wheel -->
      <rect x="-42" y="-16" width="7" height="32" rx="2" fill="#38bdf8" />
      <!-- Right wheel -->
      <rect x="35" y="-16" width="7" height="32" rx="2" fill="#38bdf8" />
      <!-- Castor / Front Indicator -->
      <circle cx="0" cy="-25" r="4" fill="#f43f5e" />
      
      <!-- Coordinate Axes: Red = X, Green = Y, Blue = Z -->
      <line x1="0" y1="0" x2="0" y2="-35" stroke="#ef4444" stroke-width="2" />
      <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#3b82f6" />
      <text x="4" y="-38" fill="#ef4444" font-family="monospace" font-size="8">X</text>
      <text x="38" y="3" fill="#10b981" font-family="monospace" font-size="8">Y</text>

      <!-- Simulated LIDAR Laser Scan Points (cyan arcs) -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,6" stroke-opacity="0.6" />
      <circle cx="-45" cy="-45" r="2.5" fill="#22d3ee" />
      <circle cx="-25" cy="-55" r="2.5" fill="#22d3ee" />
      <circle cx="0" cy="-62" r="2.5" fill="#22d3ee" />
      <circle cx="28" cy="-56" r="2.5" fill="#22d3ee" />
      <circle cx="50" cy="-40" r="2.5" fill="#22d3ee" />
      <circle cx="62" cy="-15" r="2.5" fill="#22d3ee" />
      <circle cx="-58" cy="-20" r="2.5" fill="#22d3ee" />
    </g>

    <!-- Overlay Info inside RViz -->
    <rect x="15" y="218" width="210" height="50" rx="4" fill="#08101e" stroke="#1d2e4d" stroke-width="1" />
    <text x="24" y="236" fill="#f8fafc" font-family="monospace" font-size="9">FIXED FRAME: <tspan fill="#38bdf8">odom</tspan></text>
    <text x="24" y="252" fill="#94a3b8" font-family="monospace" font-size="9">TARGET: <tspan fill="#34d399">base_link (TF OK)</tspan></text>
  </g>

  <!-- Right: Telemetry & Pose HUD -->
  <g transform="translate(540, 80)">
    <rect width="215" height="280" rx="10" fill="#080e1a" stroke="#1c2b42" stroke-width="1.2" />
    <rect x="12" y="12" width="191" height="26" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="22" y="29" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">ODOMETRY &amp; KINEMATICS</text>

    <!-- Coordinates -->
    <g transform="translate(16, 50)">
      <rect width="183" height="66" rx="6" fill="#0e1726" stroke="#25354d" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-family="monospace" font-size="9">POSITION ESTIMATE</text>
      <text x="14" y="40" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">X: +1.42 m</text>
      <text x="100" y="40" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Y: -0.85 m</text>
      <text x="14" y="56" fill="#34d399" font-family="monospace" font-size="10">YAW θ: +42.6°</text>
    </g>

    <!-- Laser Specs -->
    <g transform="translate(16, 126)">
      <rect width="183" height="72" rx="6" fill="#0e1726" stroke="#25354d" stroke-width="1" />
      <text x="14" y="20" fill="#94a3b8" font-family="monospace" font-size="9">LIDAR SPECIFICATIONS</text>
      <text x="14" y="36" fill="#e2e8f0" font-family="monospace" font-size="10">Range: 0.12m – 8.0m</text>
      <text x="14" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">Samples: 360 beams / rev</text>
      <text x="14" y="66" fill="#38bdf8" font-family="monospace" font-size="9">Frequency: 10 Hz</text>
    </g>

    <!-- Status Box -->
    <rect x="16" y="208" width="183" height="58" rx="6" fill="#050a14" stroke="#1d2e4d" stroke-width="1" />
    <text x="26" y="230" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">NEXT MILESTONE:</text>
    <text x="26" y="246" fill="#94a3b8" font-family="monospace" font-size="9">Gazebo World Obstacle Avoidance</text>
  </g>

  <!-- Bottom Banner Bar -->
  <rect x="30" y="380" width="740" height="46" rx="8" fill="#080d18" stroke="#1d2e4d" stroke-width="1" />
  <g transform="translate(50, 408)">
    <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">ENVIRONMENT:</text>
    <text x="110" y="0" fill="#f8fafc" font-family="monospace" font-size="11">UBUNTU 22.04 LTS · ROS 2 HUMBLE</text>
    <text x="430" y="0" fill="#f8fafc" font-family="monospace" font-size="11">SIM: <tspan fill="#00f0ff">RVIZ2 + URDF + GAZEBO</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <rect width="800" height="450" fill="#101310"/>
  <defs>
    <linearGradient id="dmmBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2621"/>
      <stop offset="100%" stop-color="#141815"/>
    </linearGradient>
    <linearGradient id="dmmBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28322B"/>
      <stop offset="100%" stop-color="#171C18"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080C09"/>
      <stop offset="100%" stop-color="#0E1410"/>
    </linearGradient>
  </defs>

  <!-- Chassis Outline & Bumpers -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="url(#dmmBody)" stroke="#2C372F" stroke-width="2"/>
  <!-- Rubber Corner Bumpers -->
  <path d="M50 70 V40 H80" stroke="#B6E778" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M750 70 V40 H720" stroke="#B6E778" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M50 380 V410 H80" stroke="#B6E778" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M750 380 V410 H720" stroke="#B6E778" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Brand & Model Tag -->
  <text x="80" y="76" fill="#F1F4EF" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">KEYSIGHT / FLUKE LAB BENCH DMM</text>
  <text x="80" y="94" fill="#7E8E81" font-family="monospace" font-size="11">6½ DIGIT PRECISION TRUE-RMS MULTIMETER • RAIL CALIBRATION</text>
  <circle cx="715" cy="74" r="5" fill="#B6E778"/>
  <text x="650" y="78" fill="#B6E778" font-family="monospace" font-size="10" font-weight="600">CALIBRATED</text>

  <!-- Large Precision Display -->
  <rect x="80" y="115" width="450" height="200" rx="8" fill="url(#screenGrad)" stroke="#232C25" stroke-width="2"/>
  
  <!-- Screen Header -->
  <rect x="80" y="115" width="450" height="28" rx="8" fill="#141B15"/>
  <text x="96" y="133" fill="#B6E778" font-family="monospace" font-size="11" font-weight="600">CH1 : STM32 VDD_3V3 RAIL</text>
  <text x="440" y="133" fill="#88988B" font-family="monospace" font-size="10">AUTO • 10PLC • 10GΩ</text>

  <!-- Primary Measurement -->
  <text x="100" y="210" fill="#B6E778" font-family="monospace" font-size="52" font-weight="800" letter-spacing="1">+3.30248</text>
  <text x="440" y="205" fill="#F1F4EF" font-family="monospace" font-size="34" font-weight="700">V DC</text>

  <!-- Secondary Readouts Bar -->
  <line x1="95" y1="235" x2="515" y2="235" stroke="#1D2720" stroke-width="1.5"/>
  <text x="100" y="260" fill="#7E8E81" font-family="monospace" font-size="10">AC RIPPLE (P-P)</text>
  <text x="100" y="280" fill="#F1F4EF" font-family="monospace" font-size="15" font-weight="700">12.42 mVrms</text>

  <text x="240" y="260" fill="#7E8E81" font-family="monospace" font-size="10">CURRENT DRAW</text>
  <text x="240" y="280" fill="#B6E778" font-family="monospace" font-size="15" font-weight="700">46.85 mA</text>

  <text x="380" y="260" fill="#7E8E81" font-family="monospace" font-size="10">TEMP SENSOR</text>
  <text x="380" y="280" fill="#F1F4EF" font-family="monospace" font-size="15" font-weight="700">+28.4 °C</text>

  <!-- Analog Bargraph Bar -->
  <rect x="96" y="295" width="418" height="6" rx="3" fill="#171F19"/>
  <rect x="96" y="295" width="280" height="6" rx="3" fill="#B6E778"/>

  <!-- Function Buttons Matrix -->
  <g id="functionButtons">
    <rect x="80" y="335" width="60" height="30" rx="4" fill="#B6E778"/>
    <text x="96" y="355" fill="#101310" font-family="monospace" font-size="11" font-weight="800">DCV</text>

    <rect x="150" y="335" width="60" height="30" rx="4" fill="#202822" stroke="#2E3A31"/>
    <text x="166" y="355" fill="#BAC8BC" font-family="monospace" font-size="11" font-weight="700">ACV</text>

    <rect x="220" y="335" width="60" height="30" rx="4" fill="#202822" stroke="#2E3A31"/>
    <text x="236" y="355" fill="#BAC8BC" font-family="monospace" font-size="11" font-weight="700">DCI</text>

    <rect x="290" y="335" width="60" height="30" rx="4" fill="#202822" stroke="#2E3A31"/>
    <text x="306" y="355" fill="#BAC8BC" font-family="monospace" font-size="11" font-weight="700">Ω 2W</text>

    <rect x="360" y="335" width="60" height="30" rx="4" fill="#202822" stroke="#2E3A31"/>
    <text x="372" y="355" fill="#BAC8BC" font-family="monospace" font-size="11" font-weight="700">CONT</text>

    <rect x="430" y="335" width="60" height="30" rx="4" fill="#202822" stroke="#2E3A31"/>
    <text x="442" y="355" fill="#BAC8BC" font-family="monospace" font-size="11" font-weight="700">FREQ</text>
  </g>

  <!-- Right Side: Banana Terminals & Rotary Switch -->
  <rect x="560" y="115" width="165" height="250" rx="8" fill="#171D18" stroke="#273229" stroke-width="1.5"/>
  <text x="580" y="140" fill="#BAC8BC" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">INPUT TERMINALS</text>
  
  <!-- Terminal: V / Ohm (Red HI) -->
  <circle cx="605" cy="180" r="14" fill="#3D1414" stroke="#E05252" stroke-width="3"/>
  <circle cx="605" cy="180" r="6" fill="#101310"/>
  <text x="630" y="184" fill="#E05252" font-family="monospace" font-size="11" font-weight="700">HI (+)</text>

  <!-- Terminal: COM (Black LO) -->
  <circle cx="605" cy="235" r="14" fill="#1C211E" stroke="#526256" stroke-width="3"/>
  <circle cx="605" cy="235" r="6" fill="#101310"/>
  <text x="630" y="239" fill="#9FB0A2" font-family="monospace" font-size="11" font-weight="700">LO (COM)</text>

  <!-- Terminal: Current Sense 3A (Red) -->
  <circle cx="605" cy="290" r="14" fill="#3D1414" stroke="#E05252" stroke-width="3"/>
  <circle cx="605" cy="290" r="6" fill="#101310"/>
  <text x="630" y="294" fill="#E05252" font-family="monospace" font-size="10" font-weight="700">3A FUSED</text>

  <!-- Terminal: 10A High Current -->
  <circle cx="605" cy="340" r="14" fill="#3D1414" stroke="#E05252" stroke-width="3"/>
  <circle cx="605" cy="340" r="6" fill="#101310"/>
  <text x="630" y="344" fill="#E05252" font-family="monospace" font-size="10" font-weight="700">10A MAX</text>

  <!-- Bottom Spec Bar -->
  <rect x="50" y="395" width="700" height="2" fill="#1D2620"/>
  <text x="80" y="405" fill="#5E6F62" font-family="monospace" font-size="9">CAT II 300V / CAT I 1000V • LOW BURDEN VOLTAGE • SUB-MILLIVOLT NOISE FLOOR</text>
</svg>
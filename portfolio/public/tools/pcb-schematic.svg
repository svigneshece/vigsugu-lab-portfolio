<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1410" />
      <stop offset="100%" stop-color="#1A241C" />
    </linearGradient>
    <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#B6E778" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="400" height="240" fill="url(#pcbBg)" rx="8" />
  <rect width="400" height="240" fill="url(#pcbGrid)" />
  <rect x="15" y="15" width="370" height="210" rx="8" fill="#141D16" stroke="#B6E778" stroke-opacity="0.25" stroke-width="1.2" />

  <text x="35" y="34" fill="#B6E778" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">KICAD EDA · 2-LAYER PCB SCHEMATIC</text>

  <!-- Central IC (STM32 LQFP-48) -->
  <g transform="translate(150, 75)">
    <rect width="100" height="90" rx="4" fill="#1B261E" stroke="#B6E778" stroke-width="1.5" />
    <circle cx="15" cy="15" r="3" fill="#B6E778" />
    <text x="50" y="45" fill="#F1F4EF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STM32F103</text>
    <text x="50" y="58" fill="#B6E778" font-family="monospace" font-size="8" text-anchor="middle">ARM Cortex-M3</text>
    <text x="50" y="70" fill="#9EAA9A" font-family="monospace" font-size="8" text-anchor="middle">LQFP-48</text>

    <!-- IC Pins Top & Bottom -->
    <line x1="20" y1="0" x2="20" y2="-10" stroke="#B6E778" stroke-width="1.5" />
    <line x1="40" y1="0" x2="40" y2="-10" stroke="#B6E778" stroke-width="1.5" />
    <line x1="60" y1="0" x2="60" y2="-10" stroke="#B6E778" stroke-width="1.5" />
    <line x1="80" y1="0" x2="80" y2="-10" stroke="#B6E778" stroke-width="1.5" />

    <line x1="20" y1="90" x2="20" y2="100" stroke="#B6E778" stroke-width="1.5" />
    <line x1="40" y1="90" x2="40" y2="100" stroke="#B6E778" stroke-width="1.5" />
    <line x1="60" y1="90" x2="60" y2="100" stroke="#B6E778" stroke-width="1.5" />
    <line x1="80" y1="90" x2="80" y2="100" stroke="#B6E778" stroke-width="1.5" />
  </g>

  <!-- Copper PCB Routing Tracks -->
  <!-- Track 1: Crystal Oscillator -->
  <path d="M 170 65 L 170 50 L 110 50 L 110 70" fill="none" stroke="#B6E778" stroke-width="1.5" />
  <circle cx="110" cy="70" r="3" fill="#B6E778" />
  <rect x="95" y="70" width="30" height="20" rx="3" fill="#243328" stroke="#B6E778" stroke-width="1" />
  <text x="110" y="83" fill="#B6E778" font-family="monospace" font-size="8" text-anchor="middle">8MHz</text>

  <!-- Track 2: Decoupling Capacitor VDD -->
  <path d="M 230 65 L 230 50 L 290 50 L 290 70" fill="none" stroke="#B6E778" stroke-width="1.5" />
  <circle cx="290" cy="70" r="3" fill="#B6E778" />
  <rect x="275" y="70" width="30" height="18" rx="2" fill="#243328" stroke="#B6E778" stroke-width="1" />
  <text x="290" y="82" fill="#9EAA9A" font-family="monospace" font-size="7" text-anchor="middle">100nF</text>

  <!-- Track 3: I2C Bus Pullups -->
  <path d="M 150 120 L 70 120 L 70 160" fill="none" stroke="#B6E778" stroke-width="1.8" />
  <circle cx="70" cy="160" r="4" fill="#B6E778" />
  <text x="70" y="175" fill="#F1F4EF" font-family="monospace" font-size="8" text-anchor="middle">SCL (PB6)</text>

  <path d="M 150 135 L 90 135 L 90 190" fill="none" stroke="#B6E778" stroke-width="1.8" stroke-dasharray="3,3" />
  <circle cx="90" cy="190" r="4" fill="#B6E778" />
  <text x="90" y="205" fill="#F1F4EF" font-family="monospace" font-size="8" text-anchor="middle">SDA (PB7)</text>

  <!-- Track 4: Reset & SWD Debug -->
  <path d="M 250 120 L 330 120 L 330 150" fill="none" stroke="#B6E778" stroke-width="1.8" />
  <circle cx="330" cy="150" r="4" fill="#B6E778" />
  <text x="330" y="165" fill="#B6E778" font-family="monospace" font-size="8" text-anchor="middle">SWDIO / SWCLK</text>

  <!-- Ground Plane Via Stitching -->
  <circle cx="50" cy="60" r="2" fill="#B6E778" opacity="0.6" />
  <circle cx="350" cy="60" r="2" fill="#B6E778" opacity="0.6" />
  <circle cx="50" cy="200" r="2" fill="#B6E778" opacity="0.6" />
  <circle cx="350" cy="200" r="2" fill="#B6E778" opacity="0.6" />

  <text x="260" y="212" fill="#9EAA9A" font-family="monospace" font-size="9">DRC 100% Passed · 6mil Traces</text>
</svg>

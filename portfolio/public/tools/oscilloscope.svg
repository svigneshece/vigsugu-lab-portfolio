<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <rect width="800" height="450" fill="#101310"/>
  <defs>
    <linearGradient id="dsoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B221D"/>
      <stop offset="100%" stop-color="#121613"/>
    </linearGradient>
    <pattern id="graticule" width="46" height="24" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 24" fill="none" stroke="#1A281E" stroke-width="0.75" stroke-dasharray="1 3"/>
    </pattern>
  </defs>

  <!-- Chassis Outline -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="url(#dsoBody)" stroke="#263429" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="720" height="34" rx="12" fill="#141915"/>
  <text x="65" y="52" fill="#F1F4EF" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1.5">RIGOL / SIGLENT 4-CHANNEL 200MHz DSO</text>
  <text x="440" y="52" fill="#B6E778" font-family="monospace" font-size="11" font-weight="600">● RUN / TRIG'D</text>
  <text x="560" y="52" fill="#7E8E81" font-family="monospace" font-size="10">2 GSa/s • 56 Mpts • 100ns/div</text>

  <!-- Oscilloscope Display (Graticule Screen) -->
  <rect x="60" y="75" width="480" height="270" rx="6" fill="#0A0E0B" stroke="#223026" stroke-width="2"/>
  <rect x="60" y="75" width="480" height="270" fill="url(#graticule)"/>

  <!-- Screen Reticle Center Axes -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#2B3D30" stroke-width="1.2"/>
  <line x1="300" y1="75" x2="300" y2="345" stroke="#2B3D30" stroke-width="1.2"/>

  <!-- Channel 1: SCL Clock (400kHz I2C Clock) - #B6E778 Lime -->
  <path d="M 65 140 
           H 90 V 105 H 125 V 140 H 155 V 105 H 190 V 140 H 220 V 105 H 255 V 140 
           H 285 V 105 H 320 V 140 H 350 V 105 H 385 V 140 H 415 V 105 H 450 V 140 
           H 480 V 105 H 515 V 140 H 535" 
        stroke="#B6E778" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <rect x="68" y="90" width="80" height="18" rx="3" fill="#141E15"/>
  <text x="73" y="103" fill="#B6E778" font-family="monospace" font-size="10" font-weight="700">CH1: SCL (CLK)</text>

  <!-- Channel 2: SDA Data (I2C Packet Address 0x3C + ACK) - #5EEAD4 Teal -->
  <path d="M 65 240 
           H 85 V 205 H 145 V 240 H 175 V 205 H 240 V 240 H 310 V 205 H 395 V 240 
           H 430 V 205 H 490 V 240 H 535" 
        stroke="#5EEAD4" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <rect x="68" y="190" width="80" height="18" rx="3" fill="#0F2420"/>
  <text x="73" y="203" fill="#5EEAD4" font-family="monospace" font-size="10" font-weight="700">CH2: SDA (DATA)</text>

  <!-- Hardware Protocol Decoder Banner at bottom of screen -->
  <rect x="60" y="305" width="480" height="40" fill="#131B15" stroke="#1D2A20" stroke-width="1"/>
  <text x="72" y="322" fill="#7E8E81" font-family="monospace" font-size="9" font-weight="700">I2C DECODE [BUS 1]:</text>
  <rect x="180" y="312" width="65" height="16" rx="2" fill="#1E2E22" stroke="#B6E778" stroke-width="1"/>
  <text x="186" y="324" fill="#B6E778" font-family="monospace" font-size="10" font-weight="700">ADDR 0x3C</text>

  <rect x="252" y="312" width="40" height="16" rx="2" fill="#13241C" stroke="#5EEAD4" stroke-width="1"/>
  <text x="258" y="324" fill="#5EEAD4" font-family="monospace" font-size="9" font-weight="700">WRITE</text>

  <rect x="300" y="312" width="30" height="16" rx="2" fill="#1E2E22"/>
  <text x="306" y="324" fill="#B6E778" font-family="monospace" font-size="9" font-weight="700">ACK</text>

  <rect x="340" y="312" width="190" height="16" rx="2" fill="#17221A"/>
  <text x="346" y="324" fill="#F1F4EF" font-family="monospace" font-size="9">CMD: 0xAF (SSD1306_ON)</text>

  <!-- Right Side Control Panel -->
  <g id="rightPanel">
    <!-- Trigger & Measure Cluster -->
    <rect x="560" y="75" width="180" height="160" rx="6" fill="#161C18" stroke="#253228" stroke-width="1"/>
    <text x="575" y="96" fill="#BAC8BC" font-family="monospace" font-size="10" font-weight="700">MEASURE / STATS</text>

    <text x="575" y="120" fill="#7E8E81" font-family="monospace" font-size="9">CH1 FREQUENCY</text>
    <text x="575" y="135" fill="#B6E778" font-family="monospace" font-size="13" font-weight="700">400.02 kHz</text>

    <text x="575" y="155" fill="#7E8E81" font-family="monospace" font-size="9">CH1 V_PP / RISE</text>
    <text x="575" y="170" fill="#F1F4EF" font-family="monospace" font-size="12" font-weight="600">3.31 V | 18.2 ns</text>

    <text x="575" y="190" fill="#7E8E81" font-family="monospace" font-size="9">CH2 BUS JITTER</text>
    <text x="575" y="205" fill="#5EEAD4" font-family="monospace" font-size="12" font-weight="600">&lt; 1.4 ns RMS</text>

    <!-- Rotary Knobs for Scale & Position -->
    <circle cx="610" cy="275" r="22" fill="#1E2721" stroke="#37483B" stroke-width="2"/>
    <line x1="610" y1="275" x2="622" y2="265" stroke="#B6E778" stroke-width="2.5" stroke-linecap="round"/>
    <text x="585" y="310" fill="#7E8E81" font-family="monospace" font-size="9">V/DIV (CH1)</text>

    <circle cx="690" cy="275" r="22" fill="#1E2721" stroke="#37483B" stroke-width="2"/>
    <line x1="690" y1="275" x2="702" y2="282" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="668" y="310" fill="#7E8E81" font-family="monospace" font-size="9">SEC/DIV</text>
  </g>

  <!-- Bottom Channel BNC Connectors -->
  <g id="bncCluster">
    <!-- CH1 -->
    <rect x="60" y="360" width="70" height="45" rx="5" fill="#1A241C" stroke="#B6E778" stroke-width="1.5"/>
    <circle cx="95" cy="382" r="12" fill="#0C100D" stroke="#B6E778" stroke-width="2"/>
    <circle cx="95" cy="382" r="4" fill="#B6E778"/>
    <text x="73" y="399" fill="#B6E778" font-family="monospace" font-size="9" font-weight="700">CH1 1MΩ</text>

    <!-- CH2 -->
    <rect x="145" y="360" width="70" height="45" rx="5" fill="#14211D" stroke="#5EEAD4" stroke-width="1.5"/>
    <circle cx="180" cy="382" r="12" fill="#0C100D" stroke="#5EEAD4" stroke-width="2"/>
    <circle cx="180" cy="382" r="4" fill="#5EEAD4"/>
    <text x="158" y="399" fill="#5EEAD4" font-family="monospace" font-size="9" font-weight="700">CH2 1MΩ</text>

    <!-- CH3 -->
    <rect x="230" y="360" width="70" height="45" rx="5" fill="#19201A" stroke="#36453A" stroke-width="1"/>
    <circle cx="265" cy="382" r="12" fill="#0C100D" stroke="#526456" stroke-width="1.5"/>
    <circle cx="265" cy="382" r="4" fill="#526456"/>
    <text x="245" y="399" fill="#7E8E81" font-family="monospace" font-size="9">CH3</text>

    <!-- CH4 -->
    <rect x="315" y="360" width="70" height="45" rx="5" fill="#19201A" stroke="#36453A" stroke-width="1"/>
    <circle cx="350" cy="382" r="12" fill="#0C100D" stroke="#526456" stroke-width="1.5"/>
    <circle cx="350" cy="382" r="4" fill="#526456"/>
    <text x="330" y="399" fill="#7E8E81" font-family="monospace" font-size="9">CH4</text>

    <!-- Ext Trig -->
    <rect x="400" y="360" width="70" height="45" rx="5" fill="#19201A" stroke="#36453A" stroke-width="1"/>
    <circle cx="435" cy="382" r="10" fill="#0C100D" stroke="#526456" stroke-width="1.5"/>
    <text x="412" y="399" fill="#7E8E81" font-family="monospace" font-size="8">EXT TRIG</text>

    <!-- Calibration Terminal -->
    <rect x="560" y="360" width="180" height="45" rx="5" fill="#141A16" stroke="#253228" stroke-width="1"/>
    <text x="575" y="378" fill="#BAC8BC" font-family="monospace" font-size="9" font-weight="700">PROBE COMP</text>
    <text x="575" y="394" fill="#7E8E81" font-family="monospace" font-size="9">1 kHz 3.3Vp-p CAL REF</text>
  </g>
</svg>
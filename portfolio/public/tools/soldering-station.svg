<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="solderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101310" />
      <stop offset="100%" stop-color="#1B211D" />
    </linearGradient>
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#B6E778" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#solderBg)" rx="8" />
  <rect x="15" y="15" width="370" height="210" rx="8" fill="#151A16" stroke="#B6E778" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Station Unit -->
  <rect x="30" y="45" width="130" height="145" rx="8" fill="#1E2620" stroke="#B6E778" stroke-opacity="0.3" stroke-width="1.2" />
  <!-- Display -->
  <rect x="42" y="60" width="106" height="40" rx="4" fill="#0C0F0C" stroke="#B6E778" stroke-opacity="0.4" />
  <text x="50" y="87" fill="#B6E778" font-family="monospace" font-size="20" font-weight="bold">350°C</text>
  <text x="110" y="74" fill="#9EAA9A" font-family="monospace" font-size="8">SET:350</text>
  <text x="110" y="90" fill="#B6E778" font-family="monospace" font-size="8">READY</text>
  
  <!-- Temp Knob & Power -->
  <circle cx="95" cy="140" r="22" fill="#131714" stroke="#B6E778" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="95" y1="140" x2="108" y2="128" stroke="#B6E778" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="95" cy="140" r="4" fill="#B6E778" />
  <rect x="42" y="168" width="28" height="12" rx="2" fill="#121613" stroke="#B6E778" stroke-width="1" />
  <text x="47" y="177" fill="#B6E778" font-family="monospace" font-size="8">PWR</text>

  <!-- Right: Soldering Iron, Stand & Solder Wire Spool -->
  <g transform="translate(180, 50)">
    <!-- Heavy Cast Stand with Brass Sponge -->
    <path d="M 15 135 L 120 135 L 105 100 L 30 100 Z" fill="#1B221D" stroke="#B6E778" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="85" cy="120" r="10" fill="#2E2818" stroke="#F59E0B" stroke-width="1" />
    <text x="80" y="123" fill="#F59E0B" font-family="monospace" font-size="8">CLEAN</text>

    <!-- Soldering Iron Handle -->
    <rect x="35" y="20" width="18" height="65" rx="4" fill="#242E27" stroke="#B6E778" stroke-opacity="0.4" transform="rotate(35 35 20)" />
    <!-- Heating Element & Chisel/Pencil Tip -->
    <line x1="68" y1="74" x2="110" y2="105" stroke="#B6E778" stroke-width="4.5" stroke-linecap="round" />
    <line x1="110" y1="105" x2="122" y2="114" stroke="url(#heatGlow)" stroke-width="3" stroke-linecap="round" />
    <!-- Solder Fume / Heat waves -->
    <path d="M 122 110 Q 128 95 124 85 Q 120 75 126 65" fill="none" stroke="#B6E778" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Solder Spool (Through-Hole Wire) -->
    <rect x="135" y="90" width="30" height="45" rx="3" fill="#18221B" stroke="#B6E778" stroke-width="1.2" />
    <circle cx="150" cy="112" r="8" fill="#101310" stroke="#B6E778" stroke-width="1" />
    <path d="M 150 90 Q 140 75 125 110" fill="none" stroke="#9EAA9A" stroke-width="1.5" />
    <text x="138" y="130" fill="#9EAA9A" font-family="monospace" font-size="7">SOLDER</text>
  </g>
  
  <!-- Title / Specs -->
  <text x="30" y="32" fill="#B6E778" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">ELECTRONICS SOLDERING &amp; PROTOTYPING BENCH</text>
  <text x="180" y="208" fill="#9EAA9A" font-family="monospace" font-size="9">Through-Hole Headers · Wire Tinning · Perfboard Assembly</text>
</svg>
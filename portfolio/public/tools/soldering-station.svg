<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="solderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101310" />
      <stop offset="100%" stop-color="#1B211D" />
    </linearGradient>
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#B6E778" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#solderBg)" rx="8" />
  <rect x="15" y="15" width="370" height="210" rx="8" fill="#151A16" stroke="#B6E778" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Station Unit -->
  <rect x="35" y="45" width="140" height="150" rx="8" fill="#1E2620" stroke="#B6E778" stroke-opacity="0.3" stroke-width="1.2" />
  <!-- Display -->
  <rect x="50" y="60" width="110" height="42" rx="4" fill="#0C0F0C" stroke="#B6E778" stroke-opacity="0.4" />
  <text x="60" y="88" fill="#B6E778" font-family="monospace" font-size="20" font-weight="bold">350°C</text>
  <text x="125" y="75" fill="#9EAA9A" font-family="monospace" font-size="9">SET:350</text>
  <text x="125" y="92" fill="#B6E778" font-family="monospace" font-size="9">TEMP OK</text>
  
  <!-- Temp Knob -->
  <circle cx="105" cy="145" r="24" fill="#131714" stroke="#B6E778" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="105" y1="145" x2="118" y2="132" stroke="#B6E778" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="105" cy="145" r="4" fill="#B6E778" />

  <!-- Iron Wand & Stand -->
  <g transform="translate(200, 60)">
    <!-- Stand -->
    <path d="M 30 130 L 150 130 L 130 90 L 50 90 Z" fill="#1B221D" stroke="#B6E778" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Soldering Iron Handle -->
    <rect x="50" y="20" width="22" height="70" rx="4" fill="#242E27" stroke="#B6E778" stroke-opacity="0.4" transform="rotate(35 50 20)" />
    <!-- Heating Element & Tip -->
    <line x1="88" y1="78" x2="135" y2="112" stroke="#B6E778" stroke-width="5" stroke-linecap="round" />
    <line x1="135" y1="112" x2="148" y2="122" stroke="url(#heatGlow)" stroke-width="3" stroke-linecap="round" />
    <!-- Solder Fume / Heat waves -->
    <path d="M 148 115 Q 155 100 150 90 Q 145 80 152 70" fill="none" stroke="#B6E778" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>
  
  <!-- Title / Specs -->
  <rect x="35" y="20" width="330" height="20" fill="none" />
  <text x="35" y="32" fill="#B6E778" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">SMD REWORK &amp; SOLDERING BENCH</text>
  <text x="210" y="208" fill="#9EAA9A" font-family="monospace" font-size="9">ESD-Safe · Lead-Free · 0.2mm Micro-Tip</text>
</svg>
